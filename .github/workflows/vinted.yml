name: Bot Vinted Telegram

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: bot-vinted
  cancel-in-progress: false

jobs:
  check-vinted:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Chercher les nouvelles annonces
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VINTED_SEARCH_URL: ${{ secrets.VINTED_SEARCH_URL }}
        run: python bot.py

      - name: Memoriser les annonces deja vues
        run: |
          git config user.name "vinted-bot"
          git config user.email "actions@github.com"
          git add seen.json
          git diff --cached --quiet && exit 0
          git commit -m "Mise a jour des annonces vues"
          git push
